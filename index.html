<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070F" />
    <title>飞机大战 · NEON STRIKE</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #05070F;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
      }
      #app {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(ellipse at 50% 0%, #0a1838 0%, #05070F 60%);
      }
      canvas#game {
        display: block;
        background: #05070F;
        box-shadow: 0 0 80px rgba(0, 240, 255, 0.25);
        touch-action: none;
      }
      /* 加载提示 */
      #bootTip {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        color: #00F0FF; font-size: 18px; letter-spacing: 4px;
        font-family: 'Consolas', monospace;
        text-shadow: 0 0 10px #00F0FF;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
    </div>
    <div id="bootTip">LOADING NEON STRIKE...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
